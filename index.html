<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iPhone Solo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <div class="content">
      <div class="layer layer--sharp"></div>
      <div class="layer layer--frost"></div>
    </div>
    <div class="void"></div>
  </main>

  <button class="gate" type="button">
    <span class="gate__title">iPhone Solo</span>
    <span class="gate__hint">Tap to unfold</span>
  </button>

  <div class="sheet" hidden>
    <div class="sheet__group">
      <button class="sheet__item" type="button" data-action="pick">Choose Photo</button>
      <button class="sheet__item" type="button" data-action="reset">Use Default</button>
    </div>
    <div class="sheet__group">
      <button class="sheet__item sheet__item--cancel" type="button" data-action="close">Cancel</button>
    </div>
  </div>
  <input class="picker" type="file" accept="image/*" hidden>

  <footer class="about">
    <span>Add to Home Screen for the full effect</span>
    <a href="https://github.com/soloiaros/iphone-solo">Source on GitHub</a>
  </footer>

  <script src="app.js"></script>
  <script src="background.js"></script>
</body>
</html>
