<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iPhone Solo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <div class="content">
      <div class="layer layer--sharp"></div>
      <div class="layer layer--frost"></div>
    </div>
    <div class="void"></div>
  </main>

  <button class="gate" type="button">
    <span class="gate__title">iPhone Solo</span>
    <span class="gate__hint">Tap to unfold</span>
  </button>

  <script src="app.js"></script>
</body>
</html>
